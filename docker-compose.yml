# Local Docker setup — three containers:
#   postgres  database            localhost:5432 (user postgres / password postgres / db flightbooking)
#   backend   Express API         reachable from the frontend container (not published)
#   frontend  Vue app via nginx   http://localhost:8080 (proxies /api to backend)
#
# Everything:          docker compose up --build
# Only the database:   npm run db:up   (for local development with npm run dev:*)
services:
  postgres:
    image: postgres:17-alpine
    container_name: flightbooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flightbooking
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flightbooking']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # DUFFEL_* settings come from backend/.env; the values below override the rest.
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flightbooking
      DATABASE_SSL: 'false'
      NODE_ENV: production
      PORT: '10000'
      FRONTEND_URL: http://localhost:8080

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
